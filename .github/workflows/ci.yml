name: CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Always check the exact event commit. Main checks and cloud preparation run
# independently; readiness is published only after all required checks pass.
jobs:
  cli-installer-parity:
    name: CLI installer copy parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Require web/public installers to match cli/scripts
        run: |
          set -euo pipefail
          status=0
          for name in install.sh install.ps1; do
            if ! diff -u "cli/scripts/$name" "web/public/$name"; then
              echo "::error::web/public/$name is stale; run: cp cli/scripts/$name web/public/$name"
              status=1
            fi
          done
          exit "$status"

  backend:
    name: Backend vet, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Install reference-media verification tools
        # Media tests skip themselves when ffmpeg is absent, so this step is an
        # accelerator, not a gate. It used to hard-fail the whole job when one
        # mirror was unreachable: every retry burned ~130s in connect timeout
        # and the 15-minute budget went with it. Try a few bounded mirrors and
        # continue without the binaries if none answer.
        run: |
          set -u
          dest=/usr/local/bin
          try_static() {
            local url="$1"
            curl -fsSL --connect-timeout 10 --max-time 120 "$url" -o /tmp/ffmpeg.tar.xz || return 1
            sudo tar -xJf /tmp/ffmpeg.tar.xz -C "$dest" --strip-components=1 --wildcards '*/ffmpeg' '*/ffprobe' || return 1
            ffmpeg -version | head -1
          }
          if try_static https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz; then
            exit 0
          fi
          echo "static mirror unavailable; trying the distribution package" >&2
          if sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg; then
            ffmpeg -version | head -1
            exit 0
          fi
          echo "ffmpeg unavailable; media tests will skip" >&2

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        working-directory: tokenkit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        working-directory: tokenkit
        run: go build ./...

      - name: Test root, relaykit, and tokenkit modules
        run: make test
