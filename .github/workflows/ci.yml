name: CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Always check the exact event commit. Main checks and cloud preparation run
# independently; readiness is published only after all required checks pass.
jobs:
  core-change-gate:
    name: Core business-change gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Check core paths require Core-Change-Approved
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          chmod +x scripts/ops/check-core-change-gate.sh
          scripts/ops/check-core-change-gate.sh range "${base}" "${head}"

  cli-installer-parity:
    name: CLI installer copy parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Require web/public installers to match cli/scripts
        run: |
          set -euo pipefail
          status=0
          for name in install.sh install.ps1; do
            if ! diff -u "cli/scripts/$name" "web/public/$name"; then
              echo "::error::web/public/$name is stale; run: cp cli/scripts/$name web/public/$name"
              status=1
            fi
          done
          exit "$status"

  backend:
    name: Backend vet, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Install reference-media verification tools
        # Media tests skip themselves when ffmpeg is absent, so this step is an
        # accelerator, not a gate. It used to hard-fail the whole job when one
        # mirror was unreachable: every retry burned ~130s in connect timeout
        # and the 15-minute budget went with it. Try a few bounded mirrors and
        # continue without the binaries if none answer.
        run: |
          set -u
          dest=/usr/local/bin
          try_static() {
            local url="$1"
            curl -fsSL --connect-timeout 10 --max-time 120 "$url" -o /tmp/ffmpeg.tar.xz || return 1
            sudo tar -xJf /tmp/ffmpeg.tar.xz -C "$dest" --strip-components=1 --wildcards '*/ffmpeg' '*/ffprobe' || return 1
            ffmpeg -version | head -1
          }
          if try_static https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz; then
            exit 0
          fi
          echo "static mirror unavailable; trying the distribution package" >&2
          if sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg; then
            ffmpeg -version | head -1
            exit 0
          fi
          echo "ffmpeg unavailable; media tests will skip" >&2

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        working-directory: tokenkit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        working-directory: tokenkit
        run: go build ./...

      - name: Test root, relaykit, and tokenkit modules
        run: make test

      - name: Verify thumbnail backfill resume and rate-limit handling
        run: node --test scripts/ops/image-thumbnails/backfill.test.mjs

  frontend-static:
    name: Frontend typecheck and translation coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Translation coverage
        run: bun run i18n:check

  frontend-tests:
    name: Frontend full tests (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      # Run the complete suite once across four isolated standard runners.
      # The canonical aggregate proves complete, disjoint actual coverage.
      matrix:
        include:
          - { id: four-1, shard: '1/4' }
          - { id: four-2, shard: '2/4' }
          - { id: four-3, shard: '3/4' }
          - { id: four-4, shard: '4/4' }
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Run complete partition with resource observation
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          TEST_SHARD: ${{ matrix.shard }}
          RESULT_DIRECTORY: ${{ runner.temp }}/frontend-ci
        run: python3 scripts/ops/frontend-ci.py run --shard "$TEST_SHARD" --source "$SOURCE_COMMIT" --output-dir "$RESULT_DIRECTORY"
      - name: Preserve test and resource evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-ci-${{ github.run_id }}-${{ matrix.id }}
          path: ${{ runner.temp }}/frontend-ci/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  frontend:
    # The canonical release verifier requires this one exact check name.
    name: Frontend typecheck and test
    if: always()
    needs: [frontend-static, frontend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every frontend prerequisite to succeed
        env:
          STATIC_RESULT: ${{ needs.frontend-static.result }}
          TEST_RESULT: ${{ needs.frontend-tests.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$TEST_RESULT" = success
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
      - name: Download same-run test evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: frontend-ci-${{ github.run_id }}-*
          path: ${{ runner.temp }}/frontend-evidence
      - name: Refuse incomplete, duplicated or mismatched tests
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RESULT_DIRECTORY: ${{ runner.temp }}/frontend-evidence
        run: python3 scripts/ops/frontend-ci.py aggregate --artifacts "$RESULT_DIRECTORY" --source "$SOURCE_COMMIT" --groups 4
      - name: Summarize measured frontend checks
        run: cat "${{ runner.temp }}/frontend-evidence/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve aggregate acceptance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-acceptance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/frontend-evidence/acceptance.json
            ${{ runner.temp }}/frontend-evidence/summary.md
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

