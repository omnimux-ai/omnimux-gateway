# CLI binary + optional npm release.
# Source of truth: monorepo cli/
# Release surface: public repo laozhong86/omnimux-cli (assets only).
#
# Trigger: tag cli-vX.Y.Z (semver must match cli/package.json version).
# Does not publish to private OmniMux Releases.
#
# Required secrets on this monorepo:
#   OMNIMUX_CLI_RELEASE_TOKEN — PAT/App token with contents:write on laozhong86/omnimux-cli
# Optional:
#   NPM_TOKEN — publish @omnimux/cli (npm job fails independently; does not roll back binaries)

name: CLI Release

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver without prefix (e.g. 0.3.0). Must match cli/package.json.'
        required: true

permissions:
  contents: read

jobs:
  binary:
    name: Build and publish binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          # Accept cli-vX.Y.Z or X.Y.Z
          SEMVER="${RAW#cli-}"
          SEMVER="${SEMVER#v}"
          if ! echo "$SEMVER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$'; then
            echo "::error::invalid version: ${RAW}"
            exit 1
          fi
          PKG="$(node -p "require('./cli/package.json').version")"
          if [ "$PKG" != "$SEMVER" ]; then
            echo "::error::cli/package.json version (${PKG}) != tag semver (${SEMVER}). Bump package.json first."
            exit 1
          fi
          TAG="cli-v${SEMVER}"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${TAG} (package.json=${PKG})"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Test
        working-directory: cli
        run: bun test

      - name: Build binaries
        working-directory: cli
        run: bun run build:binaries

      - name: Checksums and stage assets
        working-directory: cli
        run: |
          set -euo pipefail
          cd dist
          sha256sum omnimux-* > SHA256SUMS
          cp ../scripts/install.sh ./install.sh
          cp ../scripts/install.ps1 ./install.ps1
          ls -lh
          cat SHA256SUMS

      - name: Publish GitHub Release (public omnimux-cli)
        env:
          GH_TOKEN: ${{ secrets.OMNIMUX_CLI_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::OMNIMUX_CLI_RELEASE_TOKEN is not set"
            exit 1
          fi
          TAG="${{ steps.ver.outputs.tag }}"
          SEMVER="${{ steps.ver.outputs.semver }}"
          REPO="laozhong86/omnimux-cli"
          BODY="omnimux CLI ${SEMVER}

          Install (macOS / Linux):
          \`\`\`bash
          curl -fsSL https://omnimux.ai/install.sh | bash
          \`\`\`

          Install (Windows):
          \`\`\`powershell
          irm https://omnimux.ai/install.ps1 | iex
          \`\`\`

          Or npm:
          \`\`\`bash
          npm i -g @omnimux/cli@${SEMVER}
          \`\`\`

          Source: OmniMux monorepo \`cli/\` (private). This repository is the public binary release surface only.
          "
          # Create or overwrite assets on existing tag release
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              cli/dist/omnimux-darwin-arm64 \
              cli/dist/omnimux-darwin-x64 \
              cli/dist/omnimux-linux-x64 \
              cli/dist/omnimux-windows-x64.exe \
              cli/dist/SHA256SUMS \
              cli/dist/install.sh \
              cli/dist/install.ps1 \
              --repo "$REPO" \
              --clobber
          else
            gh release create "$TAG" \
              cli/dist/omnimux-darwin-arm64 \
              cli/dist/omnimux-darwin-x64 \
              cli/dist/omnimux-linux-x64 \
              cli/dist/omnimux-windows-x64.exe \
              cli/dist/SHA256SUMS \
              cli/dist/install.sh \
              cli/dist/install.ps1 \
              --repo "$REPO" \
              --title "omnimux CLI ${SEMVER}" \
              --notes "$BODY"
          fi
          echo "Published ${TAG} → https://github.com/${REPO}/releases/tag/${TAG}"

  npm:
    name: Publish npm @omnimux/cli
    runs-on: ubuntu-latest
    needs: binary
    # Binaries already published if this fails; keep visible failure for npm skew.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN not set; skipping npm publish"
            exit 0
          fi
          npm publish --access public
