name: Inspiration image (GHCR)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'services/inspiration/**'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish linux/amd64
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/inspiration/go.mod
          cache-dependency-path: services/inspiration/go.sum

      - name: Resolve source and tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(printf '%s' "$SOURCE_SHA" | cut -c1-12)"
          IMAGE_TAG="sha-${SHORT_SHA}"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved ghcr.io/omnimux-ai/inspiration:${IMAGE_TAG} from ${SOURCE_SHA}"

      - name: Build linux binary
        working-directory: services/inspiration
        env:
          GOARCH: amd64
        run: make build-linux

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: services/inspiration
          file: services/inspiration/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/omnimux-ai/inspiration:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build local image for artifact export
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -t omnimux-inspiration:ci-${{ github.sha }} \
            --load services/inspiration

      - name: Export image tar
        run: docker save omnimux-inspiration:ci-${{ github.sha }} -o inspiration-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inspiration-image-sha-${{ steps.meta.outputs.short_sha }}
          path: inspiration-image.tar
          retention-days: 3

      - name: Job summary
        run: |
          {
            echo "### Inspiration image"
            echo "- source SHA: \`${{ steps.meta.outputs.source_sha }}\`"
            echo "- image tag: \`ghcr.io/omnimux-ai/inspiration:${{ steps.meta.outputs.image_tag }}\`"
            echo "- image digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
